name: Test Formula

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Add local tap
        run: |
          brew tap smiinii/tap "$GITHUB_WORKSPACE"
          tap_dir="$(brew --repository smiinii/tap)"
          git -C "$tap_dir" fetch "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C "$tap_dir" checkout --detach "$GITHUB_SHA"
      - name: Check Formula style
        run: brew style smiinii/tap/oh-my-luke
      - name: Audit Formula
        run: brew audit --strict --online smiinii/tap/oh-my-luke
      - name: Install Formula
        run: brew install --formula smiinii/tap/oh-my-luke
      - name: Test Formula
        run: brew test smiinii/tap/oh-my-luke
